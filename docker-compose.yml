services:
  esdb:
    image: docker.io/thenativeweb/eventsourcingdb:1.1.0
    command: >-
      run --api-token secret --data-directory /var/lib/esdb --http-enabled=true --https-enabled=false --with-ui
    ports:
      - "3000:3000"
    volumes:
      - esdb-data:/var/lib/esdb

  postgres:
    image: postgres:17.1
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - esdb
      - postgres
    environment:
      ESDB_SERVER_URI: http://esdb:3000
      ESDB_SERVER_API_TOKEN: secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank
      SPRING_DATASOURCE_USERNAME: bank
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - "8080:8080"

volumes:
  esdb-data:
  postgres-data:
